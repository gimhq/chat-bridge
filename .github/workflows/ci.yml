name: CI

# The quality gates from README.md on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Web UI gate
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          bun run test
          bun run build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet -tags goolm ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: Test and build
        run: |
          go test -tags goolm -cover ./...
          go build -tags goolm ./...
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      # The bridgev2 Telegram instance needs cgo for its bundled libwebp; the runner's gcc is enough.
      - name: tgbridge gate
        run: |
          go vet -tags goolm,tgbridge ./...
          go test -tags goolm,tgbridge ./internal/adapters/tgbridge/
          go build -tags goolm,tgbridge ./...

  # The only check of the `signal` tag: it links libsignal, which the Dockerfile builds from Rust.
  # The layer cache keeps that stage from being rebuilt on every run.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Vet and test with every build tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
